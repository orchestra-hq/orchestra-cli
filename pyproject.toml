[project]
name = "orchestra-cli"
version = "0.3.3"
description = "Orchestra CLI. Perform operations with Orchestra locally."
readme = "README.md"
authors = [
    { name = "Orchestra Technologies", email = "support@getorchestra.io" },
]
requires-python = ">=3.10"
dependencies = [
    "click",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.scripts]
orchestra-cli = "orchestra_cli.src.cli:app"
orchestra = "orchestra_cli.src.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pyright>=1.1.405",
    "ruff>=0.13.2",
    "black>=25.9.0",
    "pytest-httpx>=0.35.0"
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E = pycodestyle error
# F = Pyflakes
# W = pycodestyle warning
# I = isort
# UP = pyupgrade
# ARG = flake8-unused-arguments
# COM = flake8-commas
# N = pep8-naming
select = ["E", "F", "W", "I", "N", "UP", "ARG", "COM"]

[tool.ruff.lint.isort]
# `requires-python = ">=3.10"` makes ruff classify tomllib as third-party, but
# the dev scripts that import it run on 3.12.
extra-standard-library = ["tomllib"]

[tool.black]
line-length = 100
exclude = '''
/(
  | \.venv
)/
'''

[tool.pyright]
typeCheckingMode = "basic"
